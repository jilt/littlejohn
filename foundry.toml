[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings=["@openzeppelin/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
auto_detect_remappings = false
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
fuzz = { runs = 256 }
invariant = { runs = 256 }

# RPC endpoints for fork testing
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL:-http://localhost:8545}"
ethereum = "${ETHEREUM_RPC_URL:-http://localhost:8545}"
botchain = "${BOTCHAIN_RPC_URL:-http://localhost:8545}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
